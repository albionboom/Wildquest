function home(){let count=mammals.filter(s=>discovered(s.id)).length;return `<div class="top"><div class="brand">⛰ WildQuest</div><div class="pill">🪙 ${state.wc} WC</div></div><div class="account-bar"><span class="muted">☁ Signed in as ${escapeHtml(currentUser?.email||"Explorer")}</span><button class="button alt small" id="logout">Log out</button></div><div class="row" style="margin-top:15px"><div><strong>${escapeHtml(state.name)}</strong><div class="muted">Level ${state.level} · Wildlife Explorer</div></div><button class="button alt small" data-page="rewards">🏆 Rewards</button></div><div class="progress" style="margin-top:12px"><div style="width:${Math.min(100,100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level)))}%"></div></div><div class="muted" style="margin-top:5px">${state.xp-totalXP(state.level)} / ${totalXP(state.level+1)-totalXP(state.level)} XP to next level</div><div class="hero">${zooScene()}<button class="button" data-page="zoo">🦌 Visit your zoo</button></div><div class="tiles"><button class="tile" data-page="camera"><span class="ico">📷</span>Capture wildlife</button><button class="tile" data-page="dex"><span class="ico">🐾</span>WildlifeDex<br><span class="muted">${state.observations.filter((o,i,a)=>a.findIndex(x=>x.speciesId===o.speciesId)===i).length} / ${allSpecies.length}</span></button><button class="tile" data-page="journal"><span class="ico">📖</span>Field journal</button><button class="tile" data-page="shop"><span class="ico">🛍️</span>Wildlife shop</button><button class="tile" data-page="friends"><span class="ico">🤝</span>Friends</button></div><div class="card"><b>Today's mission</b><p class="muted">Find a new mammal species. Each first verified discovery earns full XP and Wildlife Credits.</p></div>`}
function dex(){let list=(animalGroup==='Mammals'?mammals:swissBirds).slice().sort((a,b)=>Number(discovered(b.id))-Number(discovered(a.id))||ranks.indexOf(a.rarity)-ranks.indexOf(b.rarity)||a.name.localeCompare(b.name));if(filter!=='All')list=list.filter(s=>filter==='Discovered'?discovered(s.id):filter==='Undiscovered'?!discovered(s.id):s.rarity===filter);if(taxonFilter!=='All')list=list.filter(s=>s.order===taxonFilter);let taxa=[...new Set((animalGroup==='Mammals'?mammals:swissBirds).map(s=>s.order))].sort();return `${header('Swiss WildlifeDex')}<h1>📚 Swiss WildlifeDex</h1><div class="tabs"><button data-group="Mammals" class="${animalGroup==='Mammals'?'selected':''}">🐾 Mammals (${mammals.length})</button><button data-group="Birds" class="${animalGroup==='Birds'?'selected':''}">🐦 Birds (${swissBirds.length})</button></div><div class="muted">${list.filter(s=>discovered(s.id)).length} shown as discovered · Rarity is provisional, not a scientific Swiss abundance estimate</div><div class="tabs">${['All','Discovered','Undiscovered',...ranks].map(x=>`<button class="${filter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div><select class="input" id="taxon" aria-label="Filter taxonomic group"><option value="All">All families / orders</option>${taxa.map(t=>`<option value="${escapeHtml(t)}" ${taxonFilter===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select><div class="dex" style="margin-top:13px">${list.map(s=>{let obs=speciesObs(s.id),img=obs.find(o=>o.image)?.image;return `<div class="species" style="--rarity:${colors[s.rarity]}" data-detail="${s.id}"><div class="photo">${obs.length&&img?`<img src="${img}" alt="Your ${escapeHtml(s.name)} photo">`:`<span class="sil">${s.emoji}</span>`}</div><div class="name">${obs.length?escapeHtml(s.name):'???'}</div><div class="rarity">${s.rarity}</div></div>`}).join('')}</div>`}
function detailPage(){let s=allSpecies.find(s=>s.id===detail);if(!s)return header('Species not found','dex');let obs=speciesObs(s.id);if(!obs.length)return `${header('Undiscovered','dex')}<div class="card" style="text-align:center;border-color:${colors[s.rarity]}"><div class="sil" style="font-size:90px;padding:22px">${s.emoji}</div><h1>???</h1>${badge(s.rarity)}<p class="muted">Photograph this species to reveal its field guide.</p></div>`;let pic=obs.find(o=>o.image)?.image;let subs=s.subspecies||[];return `${header(escapeHtml(s.name),'dex')}<div class="cover" id="cover">${cover===0?(pic?`<img src="${pic}" alt="Your photograph">`:'📷 Your photo'):`<div style="text-align:center;padding:15px"><b>Reference photograph</b><div id="refphoto">Loading…</div></div>`}<span class="label">${cover===0?'Your photo':'Reference photo'}</span></div><div class="row" style="margin:10px 0"><button class="button alt small" data-cover="0">Your photo</button><button class="button alt small" data-cover="1">Reference photo</button></div><h1>${escapeHtml(s.name)}</h1><i class="muted">${escapeHtml(s.scientific)}</i><div style="margin-top:9px">${badge(s.rarity)}</div><p class="muted">${obs.length} sighting(s) · ${escapeHtml(s.order||'')}</p>${accordion('🔬 Species profile',`<div class="fact"><span>Scientific name</span><strong>${escapeHtml(s.scientific)}</strong></div><div class="fact"><span>Taxonomic group</span><strong>${escapeHtml(s.order||'')}</strong></div><div class="fact"><span>Swiss checklist status</span><strong>${escapeHtml(s.status||'Recorded')}</strong></div><div class="fact"><span>Body length</span><strong>${escapeHtml(s.length)}</strong></div><div class="fact"><span>Weight</span><strong>${escapeHtml(s.weight)}</strong></div><div class="fact"><span>Habitat</span><strong>${escapeHtml(s.habitat)}</strong></div><div class="fact"><span>Diet</span><strong>${escapeHtml(s.diet)}</strong></div>`,true)}${accordion('🧬 Subspecies',subs.length?subs.map(t=>`<div class="fact"><span>${escapeHtml(t.name)}</span><i>${escapeHtml(t.scientific)}</i></div>`).join(''):'No subspecies are listed in the supplied checklist for this species. This does not mean none exist.')}${accordion('🎨 Appearance & colour morphs',`<p>${escapeHtml(s.morphs)}</p><a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search=${encodeURIComponent(s.scientific)}">Browse photographs of this species on Wikimedia Commons ↗</a>`)}${accordion('🔎 Field research',`<p>Look for field signs, seasonal behaviour and habitat preferences. Identification of similar species or subspecies may require expert review.</p><a target="_blank" rel="noopener noreferrer" href="https://www.inaturalist.org/search?q=${encodeURIComponent(s.scientific)}">Explore observations on iNaturalist ↗</a><p class="tiny">Regional abundance and detailed ecology need authoritative Swiss verification before publication.</p>`)}${accordion('📸 Your sightings',obs.map(o=>`<p>${new Date(o.date).toLocaleDateString()} · ${escapeHtml(o.special||'Normal')} · ${o.xp||0} XP</p>`).join(''))}`}

function accordion(title,body,open=false){return `<details class="card" ${open?'open':''} style="padding:0;overflow:hidden"><summary style="padding:15px;font-weight:800;cursor:pointer">${title}</summary><div class="acc-body" style="padding:0 15px 15px">${body}</div></details>`}
function camera(){return `${header('Capture wildlife')}<h1>📷 Wildlife camera</h1><p class="muted">Upload a real photo of a wild mammal or bird. AI will suggest species; you confirm the identification. The app counts prior sightings automatically.</p><div class="card"><label><b>Choose a photo</b><input class="input" id="photo" type="file" accept="image/*" capture="environment" style="margin-top:9px"></label><div id="preview">${photoData?`<img class="preview" src="${photoData}">`:''}</div><div id="metadata" class="muted">${gps?'📍 Photo location available':'Photo GPS not checked yet'}</div><button class="button alt small" id="locate" style="margin-top:9px">📍 Use device location</button></div><button class="button" id="identify" ${photoData?'':'disabled'} style="width:100%">🔎 Identify animal with AI</button><div id="identifications" class="card ${aiResults.length?'':'hidden'}">${renderPredictions()}</div><div class="card"><b>Manual species selection</b><p class="tiny">For species missing from AI suggestions, choose the correct species yourself. Identification is player-confirmed, not expert-verified.</p><select id="manual-species" class="input"><option value="">Choose a species…</option>${allSpecies.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${selectedSpecies===s.id?'selected':''}>${escapeHtml(s.name)} (${s.scientific})</option>`).join('')}</select><div id="manual-reference" class="reference-box">${selectedSpecies!==null?`<div class="muted">Loading a reference photograph…</div>`:`<p class="tiny">Choose a species to compare with a reference photograph.</p>`}</div><div id="manual-confirm">${selectedSpecies!==null?`<button class="button" id="manual-save" style="margin-top:12px;width:100%">Record this sighting</button>`:''}</div></div><div class="notice" style="margin-top:12px">AI recognition requires internet and may download a large model. No species is saved until you confirm it. For privacy, GPS is not published or shared. Captive animals are excluded.</div>`}
function renderPredictions(){return `<b>AI suggestions</b><p class="muted">Review carefully. Suggestions can be wrong.</p>${aiResults.map((r,i)=>`<button class="option ${selectedSpecies===r.id?'selected':''}" style="width:100%;text-align:left;margin-bottom:7px" data-select="${r.id}">${i+1}. ${r.name} · ${Math.round(r.score*100)}% model score</button>`).join('')}<button class="button ghost small" id="none">None of these / uncertain</button>${selectedSpecies!==null?`<div style="margin-top:12px"><p class="muted">Potential special observation (review required)</p><select id="special" class="input"><option>None</option><option>Albino</option><option>Leucistic</option><option>Unusual colour morph</option><option>Pregnant (unverified)</option></select><label class="switch" style="margin:12px 0"><input type="checkbox" id="wild" checked> This animal is wild, not captive</label><button class="button" id="saveobs" style="width:100%">Save observation</button></div>`:''}`}
function journal(){return `${header('Field journal')}<h1>Field journal</h1><p class="muted">${state.observations.length} observations saved on this device.</p><button class="button alt small" id="export">Export observation data (JSON)</button><div class="card">${state.observations.length?state.observations.slice().reverse().map(o=>{let s=allSpecies.find(x=>x.id===o.speciesId);return `<div class="journal-item">${o.image?`<img src="${o.image}">`:'📷'}<div><b>${s.name}</b><div class="tiny">${new Date(o.date).toLocaleString()} · ${o.location?'GPS saved privately':'No GPS'}</div><div class="tiny">${o.special} · +${o.xp} XP / +${o.wc} WC</div><button class="button alt small" data-view-observation="${o.id}" style="margin-top:7px;margin-right:5px">View photo</button><button class="button ghost small" data-delete-observation="${o.id}" style="margin-top:7px">🗑 Delete</button></div></div>`}).join(''):'No sightings yet. Photograph a wild mammal to start.'}</div>`}

const rewardList=[[5,'Native tree collection','zoo:Nature:Native trees'],[10,'Green username colour','username:green'],[15,'Education kiosk','zoo:Facilities:Education kiosk'],[20,'Forest menu theme','theme:Forest'],[25,'Wildlife Explorer title','title:explorer'],[30,'Blue username colour','username:blue'],[50,'Gold username colour','username:gold']];
function rewards(){return `${header('Level rewards')}<h1>🏆 Explorer progress</h1><div class="card"><div class="metric">Level ${state.level}</div><p class="muted">${state.xp} total XP · Rewards unlock at milestones</p><div class="progress"><div style="width:${100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level))}%"></div></div></div><div class="card">${rewardList.map(([lvl,name,key])=>`<div class="shop-item"><div><b>Level ${lvl} · ${name}</b><div class="tiny">${state.level>=lvl?'Unlocked':'Locked until level '+lvl}</div></div>${state.level>=lvl?`<span class="badge" style="color:#3a914b">✓</span>`:'🔒'}</div>`).join('')}</div>`}
const themes=[['Classic',0,'Simple cream & green'],['Forest',400,'Deep green menus'],['Arctic',500,'Cool blue menus'],['Sunset',600,'Warm amber menus']];function shop(){return `${header('Wildlife shop')}<h1>🛍️ Wildlife shop</h1><div class="card row"><b>Your Wildlife Credits</b><span class="metric">🪙 ${state.wc}</span></div><h2>App themes</h2><div class="card">${themes.map(([name,price,desc])=>`<div class="shop-item"><div><b>${name}</b><div class="tiny">${desc}</div></div><button class="button small ${state.theme===name?'alt':''}" data-theme="${name}">${state.theme===name?'Equipped':state.owned.includes('theme:'+name)||price===0?'Use':price+' WC'}</button></div>`).join('')}</div><p class="muted">For habitat decorations and zoo upgrades, visit your Wildlife Zoo.</p><p class="muted">Shop items are cosmetic only. Species discoveries and scientific records cannot be purchased.</p>`}
let friendsCache=[],friendRequests=[],friendSearch=[],friendLoading=false,friendError='';
function topFinds(st){const seen=new Set();return [...(st.observations||[])].sort((a,b)=>(ranks.indexOf(allSpecies.find(x=>x.id===a.speciesId)?.rarity||'Common')-ranks.indexOf(allSpecies.find(x=>x.id===b.speciesId)?.rarity||'Common'))).filter(o=>{if(!allSpecies.find(x=>x.id===o.speciesId)||seen.has(o.speciesId))return false;seen.add(o.speciesId);return true}).slice(0,3).map(o=>allSpecies.find(x=>x.id===o.speciesId).name)}
async function publishFriendCard(){if(!currentUser||!cloudReady)return;try{const {error}=await supabase.from('explorer_cards').upsert({user_id:currentUser.id,username:state.name||'Explorer',avatar:{zooSpecies:zooAnimals().length,zooDecor:zooOwned().slice(0,80),zooSpeciesIds:zooAnimals().map(s=>s.id).slice(0,520),zooVersion:1},level:state.level,top_finds:topFinds(state),updated_at:new Date().toISOString()});if(error)throw error}catch(e){console.warn('Friend card sync:',e.message)}}
async function loadFriends(search=''){if(!currentUser)return;friendLoading=true;friendError='';render();try{
 const [{data:links,error:e1},{data:cards,error:e2}]=await Promise.all([supabase.from('friendships').select('*').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`),supabase.from('explorer_cards').select('user_id,username,avatar,level,top_finds').limit(150)]);
 if(e1||e2)throw e1||e2;friendRequests=links||[];friendsCache=cards||[];
 friendSearch=search.trim()?friendsCache.filter(x=>x.user_id!==currentUser.id&&x.username.toLowerCase().includes(search.trim().toLowerCase())).slice(0,15):[];
}catch(e){friendError='Friends database unavailable. Run the v0.5 friends SQL setup. '+e.message}finally{friendLoading=false;if(page==='friends')render()}}
function friendCard(c,action=''){return `<div class="friend-card"><div class="friend-landscape">🦌🌳🏡</div><div class="friend-meta"><b>${escapeHtml(c.username)}</b><div class="tiny">Level ${Number(c.level)||1} explorer</div><div class="finds">🏅 ${Array.isArray(c.top_finds)&&c.top_finds.length?c.top_finds.map(escapeHtml).join(' · '):'No discoveries shared yet'}</div>${action}${action.includes("data-friend-remove")?` <button class="button small" data-friend-zoo="${escapeHtml(c.user_id)}">Visit zoo</button>`:""}</div></div>`}
function visitFriendZoo(id){let c=friendsCache.find(x=>x.user_id===id);if(!c)return;let snap=c.avatar||{},ids=Array.isArray(snap.zooSpeciesIds)?snap.zooSpeciesIds:[],animals=ids.map(id=>allSpecies.find(s=>s.id===id)).filter(Boolean),decor=Array.isArray(snap.zooDecor)?snap.zooDecor:[];let overlay=document.createElement('div');overlay.className='friend-zoo-overlay';overlay.id='friend-zoo-overlay';overlay.innerHTML=`<div class="friend-zoo-panel"><div class="row"><div><h1>🌿 ${escapeHtml(c.username)}'s Zoo</h1><p class="muted">${animals.length} shared species · Level ${Number(c.level)||1}</p></div><button class="button alt" id="close-friend-zoo">Close ✕</button></div>${snap.zooVersion?zooHabitatGrid(animals,decor):'<p class="notice">This friend has not updated their zoo sharing yet. Ask them to open the latest WildQuest version.</p>'}<h2>Featured residents</h2><div>${animals.slice(0,24).map(s=>`<span class="habitat-animal">${s.emoji||'🐾'} ${escapeHtml(s.name)}</span>`).join('')||'<p class="muted">No species shared yet.</p>'}</div><p class="tiny">Only species names and decorative upgrades are shared, never observation photos or locations.</p></div>`;document.body.append(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('#close-friend-zoo'))overlay.remove()})}
function friendsPage(){const id=currentUser?.id,accepted=friendRequests.filter(f=>f.status==='accepted'),incoming=friendRequests.filter(f=>f.receiver_id===id&&f.status==='pending');return `${header('Explorer community')}<h1>🤝 Friends</h1><p class="muted">Connect with explorers and see their zoo, level and three rarest discovered species. Exact sighting locations and photos are never shared here.</p><div class="card"><label class="field-label" for="friend-query">Find an explorer by username</label><div class="row"><input id="friend-query" class="input" placeholder="Search username" maxlength="30" style="flex:1;min-width:0"><button class="button small" id="friend-find">Search</button></div><p class="tiny">Only registered explorer cards are searchable. Username matches may not be unique.</p></div>${friendError?`<div class="notice">${escapeHtml(friendError)}</div>`:''}${friendLoading?'<p class="muted">Loading explorers…</p>':''}${friendSearch.length?`<h2>Search results</h2>${friendSearch.map(c=>{let f=friendRequests.find(x=>(x.sender_id===id&&x.receiver_id===c.user_id)||(x.receiver_id===id&&x.sender_id===c.user_id));return friendCard(c,f?`<span class="badge">${f.status==='accepted'?'Friends':f.status==='pending'?'Request pending':'Request declined'}</span>`:`<button class="button small" data-friend-add="${c.user_id}">Add friend</button>`)}).join('')}`:''}<h2>Friend requests ${incoming.length?'('+incoming.length+')':''}</h2>${incoming.length?incoming.map(f=>{let c=friendsCache.find(x=>x.user_id===f.sender_id);return c?friendCard(c,`<button class="button small" data-friend-accept="${f.id}">Accept</button> <button class="button alt small" data-friend-decline="${f.id}">Decline</button>`):''}).join(''):'<p class="muted">No pending requests.</p>'}<h2>My friends (${accepted.length})</h2>${accepted.length?accepted.map(f=>{let other=f.sender_id===id?f.receiver_id:f.sender_id,c=friendsCache.find(x=>x.user_id===other);return c?friendCard(c,`<button class="button alt small" data-friend-remove="${f.id}">Remove friend</button>`):''}).join(''):'<p class="muted">Your friends will appear here.</p>'}<p class="tiny">Friend cards are a prototype feature. Shared stats are player-reported and not independently verified.</p>`}
async function friendAction(action,key){if(!currentUser)return;try{let q;if(action==='add')q=await supabase.from('friendships').insert({sender_id:currentUser.id,receiver_id:key});else if(action==='accept'||action==='decline')q=await supabase.from('friendships').update({status:action==='accept'?'accepted':'declined'}).eq('id',key);else if(action==='remove')q=await supabase.from('friendships').delete().eq('id',key);if(q.error)throw q.error;await loadFriends()}catch(e){toast(escapeHtml(e.message))}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(cloudReady&&Date.now()-(Number(state.zooLastAccrual)||Date.now())>60000)accrueZooXP();let pages={home,dex,camera,journal,zoo:zooPage,rewards,shop,friends:friendsPage};$('content').innerHTML=page==='detail'?detailPage():pages[page]();$('nav').innerHTML=[['home','⌂','Home'],['dex','🐾','Dex'],['camera','📷','Camera'],['journal','📖','Journal'],['zoo','🦌','Zoo'],['friends','🤝','Friends']].map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${label}</button>`).join('');if(page==='detail'&&cover===1)loadReference();if(page==='camera'&&selectedSpecies!==null)loadManualReference();applyTheme()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady){accrueZooXP();render()}});setInterval(()=>{if(cloudReady&&!document.hidden){accrueZooXP();if(page==='home'||page==='zoo')render()}},60000);function applyTheme(){let p={Classic:['#f7f5eb','#315e43'],Forest:['#e0e9dd','#1e4930'],Arctic:['#e6f3f8','#286c94'],Sunset:['#fcf0e0','#a66a3d']}[state.theme]||['#f7f5eb','#315e43'];document.documentElement.style.background=p[0];document.body.style.background=p[0];document.querySelectorAll('.button:not(.alt):not(.ghost)').forEach(x=>x.style.background=p[1])}
async function loadManualReference(){let id=selectedSpecies,el=$('manual-reference'),species=allSpecies.find(x=>x.id===id);if(!el||!species)return;el.innerHTML='<span class="muted">Loading reference photograph…</span>';try{let response=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(species.name));if(!response.ok)throw Error('No reference');let data=await response.json();if(id!==selectedSpecies)return;let src=data.thumbnail?.source||data.originalimage?.source;if(!src)throw Error('No reference');el.innerHTML=`<img src="${escapeHtml(src)}" alt="Reference image for ${escapeHtml(species.name)}"><div><b>${escapeHtml(species.name)}</b> · <i>${escapeHtml(species.scientific)}</i></div><p class="tiny">Reference: <a target="_blank" rel="noopener noreferrer" href="${escapeHtml(data.content_urls?.desktop?.page||'https://en.wikipedia.org')}">Wikipedia photo and attribution</a>. Compare identifying features; photo may show a different age, sex or subspecies.</p>`}catch{el.innerHTML=`<p class="tiny">Reference photo unavailable here. <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search=${encodeURIComponent(species.scientific)}">Browse real photographs of ${escapeHtml(species.name)}</a>.</p>`}}
function confirmObservationDelete(id){let o=state.observations.find(x=>String(x.id)===String(id));if(!o)return;let species=allSpecies.find(x=>x.id===o.speciesId);$('modal').innerHTML=`<div><h2>Delete observation?</h2><p>Delete your ${escapeHtml(species?.name||'wildlife')} sighting from ${new Date(o.date).toLocaleDateString()}?</p><p class="notice">This removes the photograph and private GPS data from your WildQuest save. Earned XP and Wildlife Credits from this sighting will also be deducted (up to your current balance). This cannot be undone.</p><div class="row"><button class="button alt" id="cancel-delete">Cancel</button><button class="button" id="confirm-delete" data-confirm-id="${escapeHtml(String(id))}" style="background:#a53d35">Delete permanently</button></div></div>`;$('modal').classList.remove('hidden')}

async function loadReference(){let s=allSpecies.find(x=>x.id===detail);try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(s.name));if(!res.ok)throw Error('No photo');let j=await res.json(),src=j.originalimage?.source||j.thumbnail?.source;if(!src)throw Error('No photo');let e=$('refphoto');if(e)e.innerHTML=`<img style="width:100%;max-height:180px;object-fit:contain;border-radius:10px" src="${escapeHtml(src)}"><p class="tiny">Reference: <a target="_blank" rel="noopener" href="${escapeHtml(j.content_urls?.desktop?.page||'https://en.wikipedia.org')}">Wikipedia source / image attribution</a></p>`}catch{let e=$('refphoto');if(e)e.innerHTML='<p class="muted">Reference photo unavailable. Try again online.</p>'}}

function go(p){page=p;render();window.scrollTo(0,0);if(p==='friends')loadFriends()}
function toDataUrl(f){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,850/img.width,850/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.67))};img.onerror=reject;img.src=url})}
async function readExif(f){gps=null;photoDate=null;let el=$('metadata');el.textContent='Checking photo GPS metadata…';try{let exifr=await import('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.esm.js');let g=await exifr.gps(f),m=await exifr.parse(f,{pick:['DateTimeOriginal','CreateDate']});if(g&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude))gps={latitude:g.latitude,longitude:g.longitude,source:'Photo EXIF'};if(m?.DateTimeOriginal)photoDate=new Date(m.DateTimeOriginal).toISOString();el.textContent=gps?'📍 GPS found in photo (stored privately)':'No embedded GPS found. You can use your current location.'}catch{el.textContent='Photo metadata unavailable (offline or unsupported file).'}}
let classifier;async function identify(){if(!photoData)return;let btn=$('identify');btn.disabled=true;btn.textContent='Loading wildlife AI model (may take time)…';try{if(!classifier){let m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');classifier=await m.pipeline('zero-shot-image-classification','Xenova/clip-vit-base-patch32',{device:'wasm'})}btn.textContent='Analyzing photograph…';let candidates=animalGroup==='Birds'?swissBirds.slice(0,75):mammals;let labels=candidates.map(s=>`a wildlife photograph of a ${s.name.toLowerCase()}`);let results=await classifier(photoData,labels,{candidate_labels:labels,hypothesis_template:'{}'});aiResults=results.slice(0,4).map(r=>{let id=labels.indexOf(r.label);return {...candidates[id],score:r.score}}).filter(x=>x.id!==undefined);selectedSpecies=null;$('identifications').classList.remove('hidden');$('identifications').innerHTML=renderPredictions();btn.textContent='Identify animal with AI';btn.disabled=false}catch(e){btn.textContent='Identify animal with AI';btn.disabled=false;toast('AI model could not load. It needs an internet connection and a browser that supports the model. No identification was invented. '+escapeHtml(String(e.message||e).slice(0,130)))}}
function rewardFor(s,n,special){let base={Common:[10,5],Uncommon:[30,15],Rare:[75,35],'Super Rare':[150,75],Legendary:[250,125],Mythic:[400,200]}[s.rarity];let mult=[1,.5,.25,.15,.1][Math.min(n,5)-1];let bonus={'None':[0,0],'Albino':[130,65],'Leucistic':[110,55],'Unusual colour morph':[60,30],'Pregnant (unverified)':[0,0]}[special]||[0,0];let already=state.observations.some(o=>o.speciesId===s.id&&o.special===special&&special!=='None');if(already)bonus=[0,0];return [Math.round(base[0]*mult)+bonus[0],Math.round(base[1]*mult)+bonus[1]]}
function saveObservation(){accrueZooXP();let s=allSpecies.find(x=>x.id===selectedSpecies);if(!s||!photoData)return;if(!$('wild')?.checked){toast('Only wild animals are eligible for the WildlifeDex. Captive observations are not saved in this prototype.');return}let special=$('special').value,n=speciesObs(s.id).length+1,[xp,wc]=rewardFor(s,n,special);state.zooLastAccrual=Date.now();state.observations.push({id:Date.now(),speciesId:s.id,image:photoData,date:photoDate||new Date().toISOString(),location:gps,special,xp,wc,verification:'Player-confirmed; not independently verified'});state.xp+=xp;state.wc+=wc;let old=state.level;updateLevel();save();publishFriendCard();file=null;photoData=null;gps=null;photoDate=null;aiResults=[];selectedSpecies=null;go('home');toast(`<b>${escapeHtml(s.name)} recorded!</b><br>+${xp} XP · +${wc} Wildlife Credits.${state.level>old?`<br>🎉 You reached level ${state.level}!`:''}<br><span class="tiny">This is a provisional player-confirmed observation, not yet research-verified. Special bonuses require verification in a production app.</span>`)}
$('content').addEventListener('change',e=>{if(e.target.id==='taxon'){taxonFilter=e.target.value;render()}if(e.target.id==='manual-species'){selectedSpecies=e.target.value===''?null:Number(e.target.value);render();if(selectedSpecies!==null)loadManualReference()}});$('content').addEventListener('click',async e=>{if(e.target.closest('#logout')){await supabase.auth.signOut();return}let t=e.target.closest('[data-page],[data-filter],[data-detail],[data-cover],[data-gender],[data-category],[data-equip],[data-theme],[data-buy],[data-select],#identify,#locate,#none,#saveobs,#manual-save,#export,#friend-find,[data-group], [data-zoo-category],[data-zoo-preview],[data-zoo-buy],[data-zoo-clear],[data-friend-zoo],[data-view-observation],[data-friend-add],[data-friend-accept],[data-friend-decline],[data-friend-remove],[data-delete-observation]');if(!t)return;if(t.dataset.deleteObservation){confirmObservationDelete(t.dataset.deleteObservation);return}if(t.dataset.viewObservation){let o=state.observations.find(x=>String(x.id)===String(t.dataset.viewObservation));if(o){let sp=allSpecies.find(x=>x.id===o.speciesId);$('modal').innerHTML=`<div><h2>${escapeHtml(sp?.name||'Observation')}</h2>${o.image?`<img src="${o.image}" alt="Full observation photograph" style="width:100%;height:auto;max-height:68vh;object-fit:contain;background:#162b21;border-radius:12px">`:'<p>No photograph available.</p>'}<p class="tiny">Full image shown without cropping.</p><button class="button alt" id="close-photo">Close</button></div>`;$('modal').classList.remove('hidden')}return}if(t.dataset.friendZoo){visitFriendZoo(t.dataset.friendZoo);return}if(t.dataset.zooClear){zooPreview=null;render();return}if(t.dataset.zooCategory){zooCategory=t.dataset.zooCategory;render();return}if(t.dataset.zooPreview){zooPreview=t.dataset.zooPreview;render();return}if(t.dataset.zooBuy){let key=t.dataset.zooBuy,[group,name]=key.split(':'),item=zooDecor[group]?.find(x=>x[0]===name);if(!item)return;if(zooOwned().includes(key)){toast('
