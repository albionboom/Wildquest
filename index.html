function home(){let count=mammals.filter(s=>discovered(s.id)).length;return `<div class="top"><div class="brand">⛰ WildQuest</div><div class="pill">🪙 ${state.wc} WC</div></div><div class="account-bar"><span class="muted">☁ Signed in as ${escapeHtml(currentUser?.email||"Explorer")}</span><button class="button alt small" id="logout">Log out</button></div><div class="row" style="margin-top:15px"><div><strong>${escapeHtml(state.name)}</strong><div class="muted">Level ${state.level} · Wildlife Explorer</div></div><button class="button alt small" data-page="rewards">🏆 Rewards</button></div><div class="progress" style="margin-top:12px"><div style="width:${Math.min(100,100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level)))}%"></div></div><div class="muted" style="margin-top:5px">${state.xp-totalXP(state.level)} / ${totalXP(state.level+1)-totalXP(state.level)} XP to next level</div><div class="hero">${avatarSVG()}<button class="button" data-page="avatar">✎ Customize explorer</button></div><div class="tiles"><button class="tile" data-page="camera"><span class="ico">📷</span>Capture wildlife</button><button class="tile" data-page="dex"><span class="ico">🐾</span>MammalDex<br><span class="muted">${count} / ${mammals.length}</span></button><button class="tile" data-page="journal"><span class="ico">📖</span>Field journal</button><button class="tile" data-page="shop"><span class="ico">🛍️</span>Wildlife shop</button><button class="tile" data-page="friends"><span class="ico">🤝</span>Friends</button></div><div class="card"><b>Today's mission</b><p class="muted">Find a new mammal species. Each first verified discovery earns full XP and Wildlife Credits.</p></div>`}
function dex(){let list=[...mammals].sort((a,b)=>Number(discovered(b.id))-Number(discovered(a.id))||ranks.indexOf(a.rarity)-ranks.indexOf(b.rarity)||a.name.localeCompare(b.name));if(filter!=='All')list=list.filter(s=>filter==='Discovered'?discovered(s.id):filter==='Undiscovered'?!discovered(s.id):s.rarity===filter);return `${header('MammalDex')}<h1>🐾 Mammals</h1><div class="muted">${mammals.filter(s=>discovered(s.id)).length} / ${mammals.length} discovered · Regional rarity is illustrative</div><div class="tabs">${['All','Discovered','Undiscovered',...ranks].map(x=>`<button class="${filter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="dex">${list.map(s=>{let obs=speciesObs(s.id),img=obs.find(o=>o.image)?.image;return `<div class="species" style="--rarity:${colors[s.rarity]}" data-detail="${s.id}"><div class="photo">${obs.length&&img?`<img src="${img}" alt="Your ${s.name} photo">`:`<span class="sil">${s.emoji}</span>`}</div><div class="name">${obs.length?s.name:'???'}</div><div class="rarity">${s.rarity}</div></div>`}).join('')}</div>`}
function detailPage(){let s=mammals.find(s=>s.id===detail),obs=speciesObs(s.id);if(!obs.length)return `${header('Undiscovered','dex')}<div class="card" style="text-align:center;border-color:${colors[s.rarity]}"><div class="sil" style="font-size:110px;padding:30px">${s.emoji}</div><h1>???</h1>${badge(s.rarity)}<p class="muted">Photograph this mammal to unlock its identity and species facts.</p></div>`;let pic=obs.find(o=>o.image)?.image;return `${header(s.name,'dex')}<div class="cover" id="cover">${cover===0?(pic?`<img src="${pic}">`:'📷 Your photo'):`<div style="text-align:center;padding:15px"><div style="font-size:45px">📷</div><b>Loading verified reference photo…</b><p class="muted">Requires an internet connection</p><div id="refphoto"></div></div>`}<span class="label">${cover===0?'Your photo · Swipe left →':'← Swipe right · Reference photograph'}</span></div><div class="row" style="margin:10px 0"><button class="button alt small" data-cover="0">Your photo</button><div class="muted">● ○</div><button class="button alt small" data-cover="1">Reference photo</button></div><div class="row"><div><h1 style="margin:0">${s.name}</h1><i class="muted">${s.scientific}</i></div>${badge(s.rarity)}</div><p class="muted">${obs.length} recorded sighting${obs.length===1?'':'s'}</p>${accordion('Key facts',`<div class="fact"><span>Body length</span><strong>${s.length}</strong></div><div class="fact"><span>Typical weight</span><strong>${s.weight}</strong></div><div class="fact"><span>Diet</span><strong>${s.diet}</strong></div><div class="fact"><span>Habitat</span><strong>${s.habitat}</strong></div>`,true)}${accordion('Population',`<p>Worldwide: <b>Reliable population estimate not loaded</b></p><p>In your country or state: <b>Regional data not connected</b></p><p class="muted">Future versions will cite scientific sources, dates and estimate quality.</p>`)}${accordion('Colour variations',`<p>${s.morphs}</p><p class="muted">Rare morphs such as albinism and leucism may earn separate verified bonuses.</p>`)}${accordion('Field guide & behaviour',`<div class="fact"><span>Activity</span><strong>${fieldGuides[s.id]?.activity||'Varies by season'}</strong></div><div class="fact"><span>Best habitat clues</span><strong>${fieldGuides[s.id]?.clue||s.habitat}</strong></div><p><b>Field note:</b> ${fieldGuides[s.id]?.fun||'Watch quietly from a distance and avoid disturbing wildlife.'}</p><p class="tiny">General educational notes; local ecology and season vary.</p>`)}${accordion('Colour morph photo references',`<p>Known coat variations: <b>${escapeHtml(s.morphs)}</b></p><div class="morph-grid"><div class="morph-photo"><div style="padding:14px">🎨 <b>Natural coat variations</b><p class="tiny">Morphs vary by species, age, season and genetics. Check photo captions before identifying a morph.</p></div></div><div class="morph-photo"><div style="padding:14px">🔎 <b>Explore documented morphs</b><p class="tiny">External Wikimedia Commons search, not AI images.</p><a target="_blank" rel="noopener" href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(s.name+' colour morph')}&title=Special:MediaSearch&type=image">View real photographs ↗</a></div></div></div><p class="tiny">Photos and morph labels require source verification. Not every species has documented examples.</p>`)}${accordion('My sightings',obs.slice().reverse().map(o=>`<div class="fact"><span>${new Date(o.date).toLocaleDateString()} ${o.special&&o.special!=='None'?'· '+o.special:''}</span><strong>+${o.xp} XP</strong></div>`).join(''))}${accordion('Community photographs',`<p>Community photos will appear here once accounts, permissions and moderation are built.</p>`)}<div class="notice">Species measurements are approximate. Rarity is a game-design placeholder, not a regional population assessment.</div>`}
function accordion(title,body,open=false){return `<details class="card" ${open?'open':''} style="padding:0;overflow:hidden"><summary style="padding:15px;font-weight:800;cursor:pointer">${title}</summary><div class="acc-body" style="padding:0 15px 15px">${body}</div></details>`}
function camera(){return `${header('Capture wildlife')}<h1>📷 Wildlife camera</h1><p class="muted">Upload a real photo of a wild mammal. AI will suggest species; you confirm the identification. The app counts prior sightings automatically.</p><div class="card"><label><b>Choose a photo</b><input class="input" id="photo" type="file" accept="image/*" capture="environment" style="margin-top:9px"></label><div id="preview">${photoData?`<img class="preview" src="${photoData}">`:''}</div><div id="metadata" class="muted">${gps?'📍 Photo location available':'Photo GPS not checked yet'}</div><button class="button alt small" id="locate" style="margin-top:9px">📍 Use device location</button></div><button class="button" id="identify" ${photoData?'':'disabled'} style="width:100%">🔎 Identify animal with AI</button><div id="identifications" class="card ${aiResults.length?'':'hidden'}">${renderPredictions()}</div><div class="notice" style="margin-top:12px">AI recognition requires internet and may download a large model. No species is saved until you confirm it. For privacy, GPS is not published or shared. Captive animals are excluded.</div>`}
function renderPredictions(){return `<b>AI suggestions</b><p class="muted">Review carefully. Suggestions can be wrong.</p>${aiResults.map((r,i)=>`<button class="option ${selectedSpecies===r.id?'selected':''}" style="width:100%;text-align:left;margin-bottom:7px" data-select="${r.id}">${i+1}. ${r.name} · ${Math.round(r.score*100)}% model score</button>`).join('')}<button class="button ghost small" id="none">None of these / uncertain</button>${selectedSpecies!==null?`<div style="margin-top:12px"><p class="muted">Potential special observation (review required)</p><select id="special" class="input"><option>None</option><option>Albino</option><option>Leucistic</option><option>Unusual colour morph</option><option>Pregnant (unverified)</option></select><label class="switch" style="margin:12px 0"><input type="checkbox" id="wild" checked> This animal is wild, not captive</label><button class="button" id="saveobs" style="width:100%">Save observation</button></div>`:''}`}
function journal(){return `${header('Field journal')}<h1>Field journal</h1><p class="muted">${state.observations.length} observations saved on this device.</p><button class="button alt small" id="export">Export observation data (JSON)</button><div class="card">${state.observations.length?state.observations.slice().reverse().map(o=>{let s=mammals[o.speciesId];return `<div class="journal-item">${o.image?`<img src="${o.image}">`:'📷'}<div><b>${s.name}</b><div class="tiny">${new Date(o.date).toLocaleString()} · ${o.location?'GPS saved privately':'No GPS'}</div><div class="tiny">${o.special} · +${o.xp} XP / +${o.wc} WC</div></div></div>`}).join(''):'No sightings yet. Photograph a wild mammal to start.'}</div>`}
const catalog={hat:[['None',0],['Basic cap',0],['Beanie',75],['Safari hat',180],['Ranger hat',220],['Bucket hat',140],['Winter trapper',230],['Wide-brim sunhat',180]],shirt:[['Green',0],['White',0],['Field jacket',230],['Blue',120],['Raincoat',200],['Forest hoodie',160],['Explorer vest',240],['Red flannel',170],['Black tee',100]],pants:[['Olive',0],['Blue',0],['Cargo pants',150],['Khaki',120],['Black jeans',130],['Trail shorts',90]],shoes:[['Brown',0],['Black',0],['Hiking boots',180],['White sneakers',110]],equipment:[['None',0],['Camera',0],['Binoculars',160],['Field notebook',80],['Compass',110],['Telephoto camera',300],['Walkie-talkie',200]],hair:[['Brown',0],['Black',0],['Blonde',0],['Auburn',0],['Silver',0]],skin:[['Peach',0],['Tan',0],['Deep',0]],glasses:[['None',0],['Round glasses',90],['Sunglasses',140]],accessory:[['None',0],['Scarf',120],['Bandana',100],['Backpack',170]]};const labels={hat:'Hats',shirt:'Tops',pants:'Bottoms',shoes:'Footwear',equipment:'Gear',hair:'Hair colour',skin:'Skin tone',glasses:'Eyewear',accessory:'Accessories'};

function avatarPage(){return `${header('Customize explorer')}<h1>My Explorer</h1><div class="avatar-wrap">${avatarSVG()}</div><div class="tabs"><button class="${state.avatar.gender==='Man'?'selected':''}" data-gender="Man">Man</button><button class="${state.avatar.gender==='Woman'?'selected':''}" data-gender="Woman">Woman</button></div><div class="tabs">${Object.keys(catalog).map(k=>`<button class="${editCategory===k?'selected':''}" data-category="${k}">${labels[k]}</button>`).join('')}</div><div class="options">${catalog[editCategory].map(([name,price])=>{let owned=state.owned.includes(editCategory+':'+name);return `<button class="option ${state.avatar[editCategory]===name?'selected':''} ${owned?'':'locked'}" data-equip="${name}">${name}<br><span class="tiny">${owned?'✓ Owned':`🔒 ${price} WC`}</span></button>`}).join('')}</div><p class="muted">Locked items can be purchased in the Wildlife Shop or unlocked through levels.</p>`}
const rewardList=[[5,'Explorer cap','hat:Basic cap'],[10,'Green username colour','username:green'],[15,'Field researcher jacket','shirt:Field jacket'],[20,'Forest menu theme','theme:Forest'],[25,'Wildlife Explorer title','title:explorer'],[30,'Blue username colour','username:blue'],[50,'Gold username colour','username:gold']];
function rewards(){return `${header('Level rewards')}<h1>🏆 Explorer progress</h1><div class="card"><div class="metric">Level ${state.level}</div><p class="muted">${state.xp} total XP · Rewards unlock at milestones</p><div class="progress"><div style="width:${100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level))}%"></div></div></div><div class="card">${rewardList.map(([lvl,name,key])=>`<div class="shop-item"><div><b>Level ${lvl} · ${name}</b><div class="tiny">${state.level>=lvl?'Unlocked':'Locked until level '+lvl}</div></div>${state.level>=lvl?`<span class="badge" style="color:#3a914b">✓</span>`:'🔒'}</div>`).join('')}</div>`}
const themes=[['Classic',0,'Simple cream & green'],['Forest',400,'Deep green menus'],['Arctic',500,'Cool blue menus'],['Sunset',600,'Warm amber menus']];function shop(){return `${header('Wildlife shop')}<h1>🛍️ Wildlife shop</h1><div class="card row"><b>Your Wildlife Credits</b><span class="metric">🪙 ${state.wc}</span></div><h2>App themes</h2><div class="card">${themes.map(([name,price,desc])=>`<div class="shop-item"><div><b>${name}</b><div class="tiny">${desc}</div></div><button class="button small ${state.theme===name?'alt':''}" data-theme="${name}">${state.theme===name?'Equipped':state.owned.includes('theme:'+name)||price===0?'Use':price+' WC'}</button></div>`).join('')}</div><h2>Explorer wardrobe</h2><div class="card">${Object.entries(catalog).flatMap(([cat,opts])=>opts.filter(([name,price])=>price>0).map(([name,price])=>`<div class="shop-item"><div><b>${name}</b><div class="tiny">${labels[cat]}</div></div><button class="button small alt" data-buy="${cat}:${name}">${state.owned.includes(cat+':'+name)?'Owned':price+' WC'}</button></div>`)).join('')}</div><p class="muted">Shop items are cosmetic only. Species discoveries and scientific records cannot be purchased.</p>`}
let friendsCache=[],friendRequests=[],friendSearch=[],friendLoading=false,friendError='';
function topFinds(st){const seen=new Set();return [...(st.observations||[])].sort((a,b)=>(ranks.indexOf(mammals[a.speciesId]?.rarity||'Common')-ranks.indexOf(mammals[b.speciesId]?.rarity||'Common'))).filter(o=>{if(!mammals[o.speciesId]||seen.has(o.speciesId))return false;seen.add(o.speciesId);return true}).slice(0,3).map(o=>mammals[o.speciesId].name)}
async function publishFriendCard(){if(!currentUser||!cloudReady)return;try{const {error}=await supabase.from('explorer_cards').upsert({user_id:currentUser.id,username:state.name||'Explorer',avatar:state.avatar,level:state.level,top_finds:topFinds(state),updated_at:new Date().toISOString()});if(error)throw error}catch(e){console.warn('Friend card sync:',e.message)}}
async function loadFriends(search=''){if(!currentUser)return;friendLoading=true;friendError='';render();try{
 const [{data:links,error:e1},{data:cards,error:e2}]=await Promise.all([supabase.from('friendships').select('*').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`),supabase.from('explorer_cards').select('user_id,username,avatar,level,top_finds').limit(150)]);
 if(e1||e2)throw e1||e2;friendRequests=links||[];friendsCache=cards||[];
 friendSearch=search.trim()?friendsCache.filter(x=>x.user_id!==currentUser.id&&x.username.toLowerCase().includes(search.trim().toLowerCase())).slice(0,15):[];
}catch(e){friendError='Friends database unavailable. Run the v0.5 friends SQL setup. '+e.message}finally{friendLoading=false;if(page==='friends')render()}}
function friendCard(c,action=''){return `<div class="friend-card">${avatarSVG(c.avatar)}<div class="friend-meta"><b>${escapeHtml(c.username)}</b><div class="tiny">Level ${Number(c.level)||1} explorer</div><div class="finds">🏅 ${Array.isArray(c.top_finds)&&c.top_finds.length?c.top_finds.map(escapeHtml).join(' · '):'No discoveries shared yet'}</div>${action}</div></div>`}
function friendsPage(){const id=currentUser?.id,accepted=friendRequests.filter(f=>f.status==='accepted'),incoming=friendRequests.filter(f=>f.receiver_id===id&&f.status==='pending');return `${header('Explorer community')}<h1>🤝 Friends</h1><p class="muted">Connect with explorers and see their avatar, level and three rarest discovered species. Exact sighting locations and photos are never shared here.</p><div class="card"><label class="field-label" for="friend-query">Find an explorer by username</label><div class="row"><input id="friend-query" class="input" placeholder="Search username" maxlength="30" style="flex:1;min-width:0"><button class="button small" id="friend-find">Search</button></div><p class="tiny">Only registered explorer cards are searchable. Username matches may not be unique.</p></div>${friendError?`<div class="notice">${escapeHtml(friendError)}</div>`:''}${friendLoading?'<p class="muted">Loading explorers…</p>':''}${friendSearch.length?`<h2>Search results</h2>${friendSearch.map(c=>{let f=friendRequests.find(x=>(x.sender_id===id&&x.receiver_id===c.user_id)||(x.receiver_id===id&&x.sender_id===c.user_id));return friendCard(c,f?`<span class="badge">${f.status==='accepted'?'Friends':f.status==='pending'?'Request pending':'Request declined'}</span>`:`<button class="button small" data-friend-add="${c.user_id}">Add friend</button>`)}).join('')}`:''}<h2>Friend requests ${incoming.length?'('+incoming.length+')':''}</h2>${incoming.length?incoming.map(f=>{let c=friendsCache.find(x=>x.user_id===f.sender_id);return c?friendCard(c,`<button class="button small" data-friend-accept="${f.id}">Accept</button> <button class="button alt small" data-friend-decline="${f.id}">Decline</button>`):''}).join(''):'<p class="muted">No pending requests.</p>'}<h2>My friends (${accepted.length})</h2>${accepted.length?accepted.map(f=>{let other=f.sender_id===id?f.receiver_id:f.sender_id,c=friendsCache.find(x=>x.user_id===other);return c?friendCard(c,`<button class="button alt small" data-friend-remove="${f.id}">Remove friend</button>`):''}).join(''):'<p class="muted">Your friends will appear here.</p>'}<p class="tiny">Friend cards are a prototype feature. Shared stats are player-reported and not independently verified.</p>`}
async function friendAction(action,key){if(!currentUser)return;try{let q;if(action==='add')q=await supabase.from('friendships').insert({sender_id:currentUser.id,receiver_id:key});else if(action==='accept'||action==='decline')q=await supabase.from('friendships').update({status:action==='accept'?'accepted':'declined'}).eq('id',key);else if(action==='remove')q=await supabase.from('friendships').delete().eq('id',key);if(q.error)throw q.error;await loadFriends()}catch(e){toast(escapeHtml(e.message))}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let pages={home,dex,camera,journal,avatar:avatarPage,rewards,shop,friends:friendsPage};$('content').innerHTML=page==='detail'?detailPage():pages[page]();$('nav').innerHTML=[['home','⌂','Home'],['dex','🐾','Dex'],['camera','📷','Camera'],['journal','📖','Journal'],['avatar','👤','Profile'],['friends','🤝','Friends']].map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${label}</button>`).join('');if(page==='detail'&&cover===1)loadReference();applyTheme()}
function applyTheme(){let p={Classic:['#f7f5eb','#315e43'],Forest:['#e0e9dd','#1e4930'],Arctic:['#e6f3f8','#286c94'],Sunset:['#fcf0e0','#a66a3d']}[state.theme]||['#f7f5eb','#315e43'];document.documentElement.style.background=p[0];document.body.style.background=p[0];document.querySelectorAll('.button:not(.alt):not(.ghost)').forEach(x=>x.style.background=p[1])}
async function loadReference(){let s=mammals.find(x=>x.id===detail);try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(s.name));if(!res.ok)throw Error('No photo');let j=await res.json(),src=j.originalimage?.source||j.thumbnail?.source;if(!src)throw Error('No photo');let e=$('refphoto');if(e)e.innerHTML=`<img style="width:100%;max-height:180px;object-fit:contain;border-radius:10px" src="${escapeHtml(src)}"><p class="tiny">Reference: <a target="_blank" rel="noopener" href="${escapeHtml(j.content_urls?.desktop?.page||'https://en.wikipedia.org')}">Wikipedia source / image attribution</a></p>`}catch{let e=$('refphoto');if(e)e.innerHTML='<p class="muted">Reference photo unavailable. Try again online.</p>'}}
function toast(msg){$('modal').classList.remove('hidden');$('modal').innerHTML=`<div><div class="row"><h2>WildQuest</h2><button class="button alt small" id="close">✕</button></div><p>${msg}</p><button class="button" id="ok">Continue</button></div>`}
function go(p){page=p;render();window.scrollTo(0,0);if(p==='friends')loadFriends()}
function toDataUrl(f){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,850/img.width,850/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.67))};img.onerror=reject;img.src=url})}
async function readExif(f){gps=null;photoDate=null;let el=$('metadata');el.textContent='Checking photo GPS metadata…';try{let exifr=await import('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.esm.js');let g=await exifr.gps(f),m=await exifr.parse(f,{pick:['DateTimeOriginal','CreateDate']});if(g&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude))gps={latitude:g.latitude,longitude:g.longitude,source:'Photo EXIF'};if(m?.DateTimeOriginal)photoDate=new Date(m.DateTimeOriginal).toISOString();el.textContent=gps?'📍 GPS found in photo (stored privately)':'No embedded GPS found. You can use your current location.'}catch{el.textContent='Photo metadata unavailable (offline or unsupported file).'}}
let classifier;async function identify(){if(!photoData)return;let btn=$('identify');btn.disabled=true;btn.textContent='Loading wildlife AI model (may take time)…';try{if(!classifier){let m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');classifier=await m.pipeline('zero-shot-image-classification','Xenova/clip-vit-base-patch32',{device:'wasm'})}btn.textContent='Analyzing photograph…';let labels=mammals.map(s=>`a wildlife photograph of a ${s.name.toLowerCase()}`);let results=await classifier(photoData,labels,{candidate_labels:labels,hypothesis_template:'{}'});aiResults=results.slice(0,4).map(r=>{let id=labels.indexOf(r.label);return {...mammals[id],score:r.score}}).filter(x=>x.id!==undefined);selectedSpecies=null;$('identifications').classList.remove('hidden');$('identifications').innerHTML=renderPredictions();btn.textContent='Identify animal with AI';btn.disabled=false}catch(e){btn.textContent='Identify animal with AI';btn.disabled=false;toast('AI model could not load. It needs an internet connection and a browser that supports the model. No identification was invented. '+escapeHtml(String(e.message||e).slice(0,130)))}}
function rewardFor(s,n,special){let base={Common:[10,5],Uncommon:[30,15],Rare:[75,35],'Super Rare':[150,75],Legendary:[250,125]}[s.rarity];let mult=[1,.5,.25,.15,.1][Math.min(n,5)-1];let bonus={'None':[0,0],'Albino':[130,65],'Leucistic':[110,55],'Unusual colour morph':[60,30],'Pregnant (unverified)':[0,0]}[special]||[0,0];let already=state.observations.some(o=>o.speciesId===s.id&&o.special===special&&special!=='None');if(already)bonus=[0,0];return [Math.round(base[0]*mult)+bonus[0],Math.round(base[1]*mult)+bonus[1]]}
function saveObservation(){let s=mammals.find(x=>x.id===selectedSpecies);if(!s||!photoData)return;if(!$('wild')?.checked){toast('Only wild animals are eligible for the main MammalDex. Captive observations are not saved in this prototype.');return}let special=$('special').value,n=speciesObs(s.id).length+1,[xp,wc]=rewardFor(s,n,special);state.observations.push({id:Date.now(),speciesId:s.id,image:photoData,date:photoDate||new Date().toISOString(),location:gps,special,xp,wc,verification:'Player-confirmed; not independently verified'});state.xp+=xp;state.wc+=wc;let old=state.level;updateLevel();save();publishFriendCard();file=null;photoData=null;gps=null;photoDate=null;aiResults=[];selectedSpecies=null;go('home');toast(`<b>${escapeHtml(s.name)} recorded!</b><br>+${xp} XP · +${wc} Wildlife Credits.${state.level>old?`<br>🎉 You reached level ${state.level}!`:''}<br><span class="tiny">This is a provisional player-confirmed observation, not yet research-verified. Special bonuses require verification in a production app.</span>`)}
$('content').addEventListener('click',async e=>{if(e.target.closest('#logout')){await supabase.auth.signOut();return}let t=e.target.closest('[data-page],[data-filter],[data-detail],[data-cover],[data-gender],[data-category],[data-equip],[data-theme],[data-buy],[data-select],#identify,#locate,#none,#saveobs,#export,#friend-find,[data-friend-add],[data-friend-accept],[data-friend-decline],[data-friend-remove]');if(!t)return;if(t.id==='friend-find'){await loadFriends($('friend-query')?.value||'');return}if(t.dataset.friendAdd){await friendAction('add',t.dataset.friendAdd);return}if(t.dataset.friendAccept){await friendAction('accept',t.dataset.friendAccept);return}if(t.dataset.friendDecline){await friendAction('decline',t.dataset.friendDecline);return}if(t.dataset.friendRemove){await friendAction('remove',t.dataset.friendRemove);return}if(t.dataset.page){go(t.dataset.page);return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.detail){detail=+t.dataset.detail;cover=0;go('detail');return}if(t.dataset.cover){cover=+t.dataset.cover;render();return}if(t.dataset.gender){state.avatar.gender=t.dataset.gender;save();publishFriendCard();render();return}if(t.dataset.category){editCategory=t.dataset.category;render();return}if(t.dataset.equip){let key=editCategory+':'+t.dataset.equip;if(!state.owned.includes(key)){toast('This item is locked. Visit the Wildlife Shop to unlock it.');return}state.avatar[editCategory]=t.dataset.equip;save();publishFriendCard();render();return}if(t.dataset.theme){let [name,price]=themes.find(x=>x[0]===t.dataset.theme);if(!state.owned.includes('theme:'+name)&&price){if(state.wc<price){toast('Not enough Wildlife Credits yet.');return}state.wc-=price;state.owned.push('theme:'+name)}state.theme=name;save();render();return}if(t.dataset.buy){let [cat,name]=t.dataset.buy.split(':'),price=catalog[cat].find(x=>x[0]===name)?.[1];if(state.owned.includes(t.dataset.buy))return;if(state.wc<price){toast('Not enough Wildlife Credits yet.');return}state.wc-=price;state.owned.push(t.dataset.buy);save();render();return}if(t.id==='identify'){await identify();return}if(t.id==='none'){toast('No reliable identification. Try a clearer photo. We will add expert review and more species later.');return}if(t.dataset.select!==undefined){selectedSpecies=+t.dataset.select;$('identifications').innerHTML=renderPredictions();return}if(t.id==='saveobs'){saveObservation();return}if(t.id==='locate'){if(!navigator.geolocation){toast('Geolocation is unavailable in this browser.');return}navigator.geolocation.getCurrentPosition(p=>{gps={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,source:'Device location'};$('metadata').textContent='📍 Device location captured privately (±'+Math.round(p.coords.accuracy)+' m)'},err=>toast('Location permission was not granted or location was unavailable.'),{enableHighAccuracy:true,timeout:12000});return}if(t.id==='export'){let data=JSON.stringify({notice:'Unverified prototype observations; GPS is sensitive.',observations:state.observations.map(({image,...rest})=>rest)},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='wildquest-observations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);return}});
$('content').addEventListener('keydown',e=>{if(e.target.id==='friend-query'&&e.key==='Enter'){e.preventDefault();loadFriends(e.target.value)}});$('content').addEventListener('change',async e=>{if(e.target.id==='photo'){file=e.target.files[0];if(!file)return;aiResults=[];selectedSpecies=null;try{photoData=await toDataUrl(file);$('preview').innerHTML=`<img class="preview" src="${photoData}">`;$('identify').disabled=false;await readExif(file)}catch{toast('Unable to open this photo. Try a JPEG image.')}}});$('nav').addEventListener('click',e=>{let t=e.target.closest('[data-page]');if(t)go(t.dataset.page)});$('modal').addEventListener('click',e=>{if(e.target.id==='close'||e.target.id==='ok'||e.target.id==='modal')$('modal').classList.add('hidden')});let startX=0;$('content').addEventListener('touchstart',e=>{if(e.target.closest('#cover'))startX=e.touches[0].clientX},{passive:true});$('content').addEventListener('touchend',e=>{if(e.target.closest('#cover')&&Math.abs(e.changedTouches[0].clientX-startX)>45){cover=e.changedTouches[0].clientX<startX?1:0;render()}},{passive:true});bootAccounts();
</script></body></html>
