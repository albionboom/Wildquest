<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5eb"><title>WildQuest v0.3</title><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d392b;background:#f7f5eb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:510px;margin:auto;min-height:100dvh;padding:20px 17px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-family:Georgia,serif;font-size:30px;font-weight:800;letter-spacing:-1.2px}.muted{color:#6e786d;font-size:13px}.pill{border:1px solid #d7decc;background:white;border-radius:30px;padding:8px 12px;font-weight:750}.card{border:1px solid #e0e5d8;background:#fffdf7;border-radius:21px;padding:17px;margin:13px 0;box-shadow:0 2px 9px #193b2008}.hero{background:#e4ecdb;border-radius:22px;text-align:center;overflow:hidden;position:relative;padding:15px 12px 0;margin-top:15px}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,#f4f9df,transparent 55%);pointer-events:none}.avatar{width:190px;height:235px;max-width:100%;position:relative;display:block;margin:0 auto}.hero .avatar{height:240px}.button{border:0;border-radius:13px;background:#315e43;color:white;padding:13px 17px;font-weight:750}.button.alt{background:#edf2e8;color:#28533c}.button.ghost{border:1px solid #cad8c7;background:transparent;color:#315e43}.button.small{padding:9px 11px;font-size:12px}.button:active,.tile:active{transform:scale(.985)}.hero .button{position:relative;margin:0 0 15px}.progress{height:10px;background:#d6dfd1;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#6eaa5c;border-radius:10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tile{padding:20px 10px;border-radius:16px;border:1px solid #e1e5d9;background:#fffdf7;text-align:center;font-weight:750}.tile .ico{font-size:25px;display:block;margin-bottom:6px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:510px;width:100%;background:#fffdf9;border-top:1px solid #dfe4d8;display:flex;justify-content:space-around;padding:10px 5px max(12px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#64776a;font-size:11px;font-weight:700;display:grid;justify-items:center;gap:4px}.nav button span{font-size:22px}.nav button.active{color:#2f7943}.hidden{display:none!important}h1{font-size:24px;margin:18px 0 5px}h2{font-size:17px;margin:18px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-block;border:1px solid currentColor;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap;border:1px solid #d9dfd3;background:#fff;padding:9px 12px;border-radius:11px;font-size:12px;font-weight:700}.tabs button.selected{background:#315e43;color:white}.dex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.species{background:#fff;border:2px solid var(--rarity);border-radius:15px;overflow:hidden;text-align:center;min-width:0;cursor:pointer}.species .photo{height:103px;background:color-mix(in srgb,var(--rarity) 13%,#e8e9e4);display:grid;place-items:center;overflow:hidden}.species img{width:100%;height:100%;object-fit:cover}.sil{font-size:60px;filter:brightness(0);opacity:.86;line-height:1}.species .name{font-size:12px;font-weight:800;margin:8px 3px 3px;min-height:29px;overflow-wrap:anywhere}.species .rarity{font-size:10px;color:var(--rarity);font-weight:800;margin:0 2px 8px}.info{font-size:13px;line-height:1.6}.cover{height:240px;border-radius:16px;background:#e6ece2;overflow:hidden;display:grid;place-items:center;position:relative}.cover img{height:100%;width:100%;object-fit:cover}.cover .label{position:absolute;bottom:8px;left:8px;background:#163728e0;color:white;padding:6px 10px;border-radius:8px;font-size:11px}.dots{text-align:center;letter-spacing:4px;color:#7c8b7e;margin:8px}.fact{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e8eae3;font-size:13px}.fact strong{text-align:right}.accordion{width:100%;text-align:left;background:#edf2e9;border:0;padding:13px;border-radius:12px;margin-top:8px;font-weight:800;color:#28533c}.acc-body{padding:9px 5px;font-size:13px;line-height:1.6}.input{width:100%;border:1px solid #d3dbcd;border-radius:12px;padding:12px;background:white;color:#234331}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.option{border:1px solid #dce2d6;background:white;padding:11px 5px;border-radius:12px;font-size:12px;font-weight:750}.option.selected{outline:2px solid #4c8b53}.option.locked{opacity:.65}.avatar-wrap{background:#e8efdf;border-radius:20px;text-align:center;padding:9px}.notice{background:#fff3d6;border-radius:12px;padding:11px;color:#68511e;font-size:12px;line-height:1.5}.preview{max-width:100%;max-height:230px;border-radius:14px;display:block;margin:10px auto}.journal-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #e8eae3}.journal-item img{width:65px;height:65px;object-fit:cover;border-radius:10px}.shop-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #e5e9de}.shop-item>div{flex:1}.tiny{font-size:11px;color:#718071}a{color:#2f6543}.loader{animation:pulse 1.2s infinite alternate}@keyframes pulse{to{opacity:.45}}.modal{position:fixed;inset:0;background:#16271c88;z-index:25;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:#fffdf7;border-radius:24px 24px 0 0;width:min(510px,100%);max-height:85dvh;overflow:auto;padding:22px 18px 35px}.metric{font-weight:850;font-size:22px}.switch{display:flex;gap:8px;align-items:center}.switch input{accent-color:#315e43}input[type=file]{max-width:100%}
</style></head><body><main class="app"><div id="content"></div></main><nav class="nav" id="nav"></nav><div id="modal" class="modal hidden"></div><script type="module">
const $=id=>document.getElementById(id);const colors={Common:'#3caa45',Uncommon:'#e54c4c',Rare:'#189aff','Super Rare':'#ad42d7',Legendary:'#d4a521'};const ranks=['Legendary','Super Rare','Rare','Uncommon','Common'];
const mammals=[['Red Fox','Vulpes vulpes','Common','🦊','45–90 cm','3–14 kg','Omnivore','Forests, fields, towns','Red, silver, cross'],['Roe Deer','Capreolus capreolus','Common','🦌','95–135 cm','15–35 kg','Herbivore','Woodlands and fields','Reddish summer, grey winter'],['European Hedgehog','Erinaceus europaeus','Common','🦔','20–30 cm','0.6–1.2 kg','Insectivore','Gardens, hedgerows','Brown; rare pale morphs'],['European Rabbit','Oryctolagus cuniculus','Common','🐇','34–50 cm','1.2–2.5 kg','Herbivore','Grasslands and scrub','Brown, black, white'],['Red Squirrel','Sciurus vulgaris','Uncommon','🐿️','19–23 cm body','0.25–0.35 kg','Omnivore','Forests and parks','Red, brown, dark'],['European Badger','Meles meles','Uncommon','🦡','60–90 cm','7–17 kg','Omnivore','Woodlands and farmland','Black and white'],['European Otter','Lutra lutra','Rare','🦦','57–95 cm body','5–12 kg','Carnivore','Rivers and wetlands','Brown; rare pale morphs'],['Red Deer','Cervus elaphus','Rare','🦌','160–250 cm','80–240 kg','Herbivore','Woodland and grassland','Reddish brown, dark'],['Wild Boar','Sus scrofa','Uncommon','🐗','90–200 cm','40–150 kg','Omnivore','Woodland and scrub','Brown, black, piebald'],['Eurasian Lynx','Lynx lynx','Super Rare','🐈','80–130 cm','15–30 kg','Carnivore','Forested landscapes','Spotted, plain, pale'],['European Wildcat','Felis silvestris','Super Rare','🐈','45–80 cm body','3–8 kg','Carnivore','Woodland','Grey-brown tabby'],['Grey Wolf','Canis lupus','Legendary','🐺','100–160 cm body','25–55 kg','Carnivore','Forests and open habitats','Grey, black, white'],['Brown Bear','Ursus arctos','Legendary','🐻','140–280 cm','80–350+ kg','Omnivore','Mountains and forests','Brown, blonde, dark']].map((a,i)=>({id:i,name:a[0],scientific:a[1],rarity:a[2],emoji:a[3],length:a[4],weight:a[5],diet:a[6],habitat:a[7],morphs:a[8]}));
const initial={level:1,xp:0,wc:0,observations:[],avatar:{gender:'Man',hat:'None',shirt:'Green',pants:'Olive',shoes:'Brown',equipment:'Camera'},owned:['hat:None','hat:Basic cap','shirt:Green','shirt:White','pants:Olive','pants:Blue','shoes:Brown','shoes:Black','equipment:None','equipment:Camera'],theme:'Classic',claimed:[],name:'Explorer'};
let state;try{state={...initial,...JSON.parse(localStorage.getItem('wq03')||'{}')}}catch{state=structuredClone(initial)};let page='home',filter='All',detail=null,cover=0,editCategory='hat',file=null,photoData=null,gps=null,photoDate=null,model=null,aiResults=[],selectedSpecies=null,feedback='';const save=()=>{try{localStorage.setItem('wq03',JSON.stringify(state))}catch(e){alert('Device storage is full. Your recent photo may not persist.')}};const discovered=id=>state.observations.some(o=>o.speciesId===id);const speciesObs=id=>state.observations.filter(o=>o.speciesId===id);const totalXP=l=>Math.round(150*(l-1)*l/2);function updateLevel(){while(state.xp>=totalXP(state.level+1))state.level++}function header(title,back='home'){return `<div class="top"><button class="button alt small" data-page="${back}">← Back</button><b>${title}</b><span></span></div>`}function badge(r){return `<span class="badge" style="color:${colors[r]}">${r}</span>`}function avatarSVG(){let a=state.avatar,hat=a.hat,shirt={Green:'#688d62',White:'#e7e9d8','Field jacket':'#99764f',Blue:'#6b8eaf'}[a.shirt]||'#688d62',pants={Olive:'#525c45',Blue:'#49637b','Cargo pants':'#b49b6b'}[a.pants]||'#525c45',shoes=a.shoes==='Black'?'#323938':'#795638',hair=a.gender==='Woman'?'#53392d':'#4a332a';return `<svg class="avatar" viewBox="0 0 180 240" role="img" aria-label="Cartoon explorer avatar"><ellipse cx="90" cy="230" rx="52" ry="7" fill="#b9c9b4"/><path d="M58 143 L55 220 L83 220 L90 170 L98 220 L126 220 L121 143Z" fill="${pants}"/><path d="M54 214h30v19H48q-5-14 6-19 M99 214h29q10 4 7 19H99Z" fill="${shoes}"/><path d="M62 107Q89 98 119 107L133 168H48Z" fill="${shirt}"/><path d="M60 114L38 157L50 163L72 132 M120 114L142 155L130 163L108 132" stroke="${shirt}" stroke-width="15" stroke-linecap="round" fill="none"/><circle cx="45" cy="163" r="8" fill="#e9b78f"/><circle cx="135" cy="162" r="8" fill="#e9b78f"/><rect x="80" y="91" width="20" height="21" rx="7" fill="#e1ab82"/>${a.gender==='Woman'?`<path d="M50 64Q49 16 90 17Q134 17 130 68L130 112L117 109L115 55L65 55L63 109L50 111Z" fill="${hair}"/>`:''}<ellipse cx="90" cy="61" rx="37" ry="44" fill="#edc29e"/><path d="M54 55Q49 16 89 17Q131 16 127 53L119 41Q85 48 60 38Z" fill="${hair}"/><ellipse cx="77" cy="65" rx="3" ry="4" fill="#27312a"/><ellipse cx="103" cy="65" rx="3" ry="4" fill="#27312a"/><path d="M83 84Q90 90 97 84" fill="none" stroke="#ae765e" stroke-width="2.4" stroke-linecap="round"/>${hat==='None'?'':hat==='Beanie'?'<path d="M53 46Q52 6 91 7Q129 8 127 46Z" fill="#be9556"/><rect x="52" y="39" width="77" height="13" rx="5" fill="#a78248"/>':hat==='Safari hat'?'<path d="M56 43L64 18Q90 3 117 18L126 43Z" fill="#b7a070"/><ellipse cx="90" cy="47" rx="56" ry="9" fill="#a38b5c"/>':`<path d="M53 43Q52 11 90 10Q128 11 128 43Z" fill="#587348"/><path d="M83 40Q126 35 143 47Q120 57 86 51Z" fill="#455e3d"/>`}${a.equipment==='Camera'?'<rect x="75" y="129" width="30" height="22" rx="5" fill="#374640"/><circle cx="90" cy="140" r="8" fill="#b2c6c4"/><circle cx="90" cy="140" r="5" fill="#4e6664"/><path d="M80 130L74 113M100 130L107 113" stroke="#3e4438" stroke-width="3"/>':a.equipment==='Binoculars'?'<rect x="73" y="130" width="14" height="25" rx="5" fill="#3a4740"/><rect x="93" y="130" width="14" height="25" rx="5" fill="#3a4740"/><path d="M78 131L74 114M102 131L106 114" stroke="#3a4740" stroke-width="3"/>':''}${a.shirt==='Field jacket'?'<path d="M90 107V163M70 139H82M98 139H110" stroke="#624d34" stroke-width="2"/>':''}</svg>`}
function home(){let count=mammals.filter(s=>discovered(s.id)).length;return `<div class="top"><div class="brand">⛰ WildQuest</div><div class="pill">🪙 ${state.wc} WC</div></div><div class="row" style="margin-top:15px"><div><strong>${escapeHtml(state.name)}</strong><div class="muted">Level ${state.level} · Wildlife Explorer</div></div><button class="button alt small" data-page="rewards">🏆 Rewards</button></div><div class="progress" style="margin-top:12px"><div style="width:${Math.min(100,100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level)))}%"></div></div><div class="muted" style="margin-top:5px">${state.xp-totalXP(state.level)} / ${totalXP(state.level+1)-totalXP(state.level)} XP to next level</div><div class="hero">${avatarSVG()}<button class="button" data-page="avatar">✎ Customize explorer</button></div><div class="tiles"><button class="tile" data-page="camera"><span class="ico">📷</span>Capture wildlife</button><button class="tile" data-page="dex"><span class="ico">🐾</span>MammalDex<br><span class="muted">${count} / ${mammals.length}</span></button><button class="tile" data-page="journal"><span class="ico">📖</span>Field journal</button><button class="tile" data-page="shop"><span class="ico">🛍️</span>Wildlife shop</button></div><div class="card"><b>Today's mission</b><p class="muted">Find a new mammal species. Each first verified discovery earns full XP and Wildlife Credits.</p></div>`}
function dex(){let list=[...mammals].sort((a,b)=>Number(discovered(b.id))-Number(discovered(a.id))||ranks.indexOf(a.rarity)-ranks.indexOf(b.rarity)||a.name.localeCompare(b.name));if(filter!=='All')list=list.filter(s=>filter==='Discovered'?discovered(s.id):filter==='Undiscovered'?!discovered(s.id):s.rarity===filter);return `${header('MammalDex')}<h1>🐾 Mammals</h1><div class="muted">${mammals.filter(s=>discovered(s.id)).length} / ${mammals.length} discovered · Regional rarity is illustrative</div><div class="tabs">${['All','Discovered','Undiscovered',...ranks].map(x=>`<button class="${filter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="dex">${list.map(s=>{let obs=speciesObs(s.id),img=obs.find(o=>o.image)?.image;return `<div class="species" style="--rarity:${colors[s.rarity]}" data-detail="${s.id}"><div class="photo">${obs.length&&img?`<img src="${img}" alt="Your ${s.name} photo">`:`<span class="sil">${s.emoji}</span>`}</div><div class="name">${obs.length?s.name:'???'}</div><div class="rarity">${s.rarity}</div></div>`}).join('')}</div>`}
function detailPage(){let s=mammals.find(s=>s.id===detail),obs=speciesObs(s.id);if(!obs.length)return `${header('Undiscovered','dex')}<div class="card" style="text-align:center;border-color:${colors[s.rarity]}"><div class="sil" style="font-size:110px;padding:30px">${s.emoji}</div><h1>???</h1>${badge(s.rarity)}<p class="muted">Photograph this mammal to unlock its identity and species facts.</p></div>`;let pic=obs.find(o=>o.image)?.image;return `${header(s.name,'dex')}<div class="cover" id="cover">${cover===0?(pic?`<img src="${pic}">`:'📷 Your photo'):`<div style="text-align:center;padding:15px"><div style="font-size:45px">📷</div><b>Loading verified reference photo…</b><p class="muted">Requires an internet connection</p><div id="refphoto"></div></div>`}<span class="label">${cover===0?'Your photo · Swipe left →':'← Swipe right · Reference photograph'}</span></div><div class="row" style="margin:10px 0"><button class="button alt small" data-cover="0">Your photo</button><div class="muted">● ○</div><button class="button alt small" data-cover="1">Reference photo</button></div><div class="row"><div><h1 style="margin:0">${s.name}</h1><i class="muted">${s.scientific}</i></div>${badge(s.rarity)}</div><p class="muted">${obs.length} recorded sighting${obs.length===1?'':'s'}</p>${accordion('Key facts',`<div class="fact"><span>Body length</span><strong>${s.length}</strong></div><div class="fact"><span>Typical weight</span><strong>${s.weight}</strong></div><div class="fact"><span>Diet</span><strong>${s.diet}</strong></div><div class="fact"><span>Habitat</span><strong>${s.habitat}</strong></div>`,true)}${accordion('Population',`<p>Worldwide: <b>Reliable population estimate not loaded</b></p><p>In your country or state: <b>Regional data not connected</b></p><p class="muted">Future versions will cite scientific sources, dates and estimate quality.</p>`)}${accordion('Colour variations',`<p>${s.morphs}</p><p class="muted">Rare morphs such as albinism and leucism may earn separate verified bonuses.</p>`)}${accordion('My sightings',obs.slice().reverse().map(o=>`<div class="fact"><span>${new Date(o.date).toLocaleDateString()} ${o.special&&o.special!=='None'?'· '+o.special:''}</span><strong>+${o.xp} XP</strong></div>`).join(''))}${accordion('Community photographs',`<p>Community photos will appear here once accounts, permissions and moderation are built.</p>`)}<div class="notice">Species measurements are approximate. Rarity is a game-design placeholder, not a regional population assessment.</div>`}
function accordion(title,body,open=false){return `<details class="card" ${open?'open':''} style="padding:0;overflow:hidden"><summary style="padding:15px;font-weight:800;cursor:pointer">${title}</summary><div class="acc-body" style="padding:0 15px 15px">${body}</div></details>`}
function camera(){return `${header('Capture wildlife')}<h1>📷 Wildlife camera</h1><p class="muted">Upload a real photo of a wild mammal. AI will suggest species; you confirm the identification. The app counts prior sightings automatically.</p><div class="card"><label><b>Choose a photo</b><input class="input" id="photo" type="file" accept="image/*" capture="environment" style="margin-top:9px"></label><div id="preview">${photoData?`<img class="preview" src="${photoData}">`:''}</div><div id="metadata" class="muted">${gps?'📍 Photo location available':'Photo GPS not checked yet'}</div><button class="button alt small" id="locate" style="margin-top:9px">📍 Use device location</button></div><button class="button" id="identify" ${photoData?'':'disabled'} style="width:100%">🔎 Identify animal with AI</button><div id="identifications" class="card ${aiResults.length?'':'hidden'}">${renderPredictions()}</div><div class="notice" style="margin-top:12px">AI recognition requires internet and may download a large model. No species is saved until you confirm it. For privacy, GPS is not published or shared. Captive animals are excluded.</div>`}
function renderPredictions(){return `<b>AI suggestions</b><p class="muted">Review carefully. Suggestions can be wrong.</p>${aiResults.map((r,i)=>`<button class="option ${selectedSpecies===r.id?'selected':''}" style="width:100%;text-align:left;margin-bottom:7px" data-select="${r.id}">${i+1}. ${r.name} · ${Math.round(r.score*100)}% model score</button>`).join('')}<button class="button ghost small" id="none">None of these / uncertain</button>${selectedSpecies!==null?`<div style="margin-top:12px"><p class="muted">Potential special observation (review required)</p><select id="special" class="input"><option>None</option><option>Albino</option><option>Leucistic</option><option>Unusual colour morph</option><option>Pregnant (unverified)</option></select><label class="switch" style="margin:12px 0"><input type="checkbox" id="wild" checked> This animal is wild, not captive</label><button class="button" id="saveobs" style="width:100%">Save observation</button></div>`:''}`}
function journal(){return `${header('Field journal')}<h1>Field journal</h1><p class="muted">${state.observations.length} observations saved on this device.</p><button class="button alt small" id="export">Export observation data (JSON)</button><div class="card">${state.observations.length?state.observations.slice().reverse().map(o=>{let s=mammals[o.speciesId];return `<div class="journal-item">${o.image?`<img src="${o.image}">`:'📷'}<div><b>${s.name}</b><div class="tiny">${new Date(o.date).toLocaleString()} · ${o.location?'GPS saved privately':'No GPS'}</div><div class="tiny">${o.special} · +${o.xp} XP / +${o.wc} WC</div></div></div>`}).join(''):'No sightings yet. Photograph a wild mammal to start.'}</div>`}
const catalog={hat:[['None',0],['Basic cap',0],['Beanie',75],['Safari hat',180]],shirt:[['Green',0],['White',0],['Field jacket',230],['Blue',120]],pants:[['Olive',0],['Blue',0],['Cargo pants',150]],shoes:[['Brown',0],['Black',0]],equipment:[['None',0],['Camera',0],['Binoculars',160]]};const labels={hat:'Hats',shirt:'Shirts',pants:'Pants',shoes:'Shoes',equipment:'Equipment'};
function avatarPage(){return `${header('Customize explorer')}<h1>My Explorer</h1><div class="avatar-wrap">${avatarSVG()}</div><div class="tabs"><button class="${state.avatar.gender==='Man'?'selected':''}" data-gender="Man">Man</button><button class="${state.avatar.gender==='Woman'?'selected':''}" data-gender="Woman">Woman</button></div><div class="tabs">${Object.keys(catalog).map(k=>`<button class="${editCategory===k?'selected':''}" data-category="${k}">${labels[k]}</button>`).join('')}</div><div class="options">${catalog[editCategory].map(([name,price])=>{let owned=state.owned.includes(editCategory+':'+name);return `<button class="option ${state.avatar[editCategory]===name?'selected':''} ${owned?'':'locked'}" data-equip="${name}">${name}<br><span class="tiny">${owned?'✓ Owned':`🔒 ${price} WC`}</span></button>`}).join('')}</div><p class="muted">Locked items can be purchased in the Wildlife Shop or unlocked through levels.</p>`}
const rewardList=[[5,'Explorer cap','hat:Basic cap'],[10,'Green username colour','username:green'],[15,'Field researcher jacket','shirt:Field jacket'],[20,'Forest menu theme','theme:Forest'],[25,'Wildlife Explorer title','title:explorer'],[30,'Blue username colour','username:blue'],[50,'Gold username colour','username:gold']];
function rewards(){return `${header('Level rewards')}<h1>🏆 Explorer progress</h1><div class="card"><div class="metric">Level ${state.level}</div><p class="muted">${state.xp} total XP · Rewards unlock at milestones</p><div class="progress"><div style="width:${100*(state.xp-totalXP(state.level))/(totalXP(state.level+1)-totalXP(state.level))}%"></div></div></div><div class="card">${rewardList.map(([lvl,name,key])=>`<div class="shop-item"><div><b>Level ${lvl} · ${name}</b><div class="tiny">${state.level>=lvl?'Unlocked':'Locked until level '+lvl}</div></div>${state.level>=lvl?`<span class="badge" style="color:#3a914b">✓</span>`:'🔒'}</div>`).join('')}</div>`}
const themes=[['Classic',0,'Simple cream & green'],['Forest',400,'Deep green menus'],['Arctic',500,'Cool blue menus'],['Sunset',600,'Warm amber menus']];function shop(){return `${header('Wildlife shop')}<h1>🛍️ Wildlife shop</h1><div class="card row"><b>Your Wildlife Credits</b><span class="metric">🪙 ${state.wc}</span></div><h2>App themes</h2><div class="card">${themes.map(([name,price,desc])=>`<div class="shop-item"><div><b>${name}</b><div class="tiny">${desc}</div></div><button class="button small ${state.theme===name?'alt':''}" data-theme="${name}">${state.theme===name?'Equipped':state.owned.includes('theme:'+name)||price===0?'Use':price+' WC'}</button></div>`).join('')}</div><h2>Explorer wardrobe</h2><div class="card">${Object.entries(catalog).flatMap(([cat,opts])=>opts.filter(([name,price])=>price>0).map(([name,price])=>`<div class="shop-item"><div><b>${name}</b><div class="tiny">${labels[cat]}</div></div><button class="button small alt" data-buy="${cat}:${name}">${state.owned.includes(cat+':'+name)?'Owned':price+' WC'}</button></div>`)).join('')}</div><p class="muted">Shop items are cosmetic only. Species discoveries and scientific records cannot be purchased.</p>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let pages={home,dex,camera,journal,avatar:avatarPage,rewards,shop};$('content').innerHTML=page==='detail'?detailPage():pages[page]();$('nav').innerHTML=[['home','⌂','Home'],['dex','🐾','Dex'],['camera','📷','Camera'],['journal','📖','Journal'],['avatar','👤','Profile']].map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${label}</button>`).join('');if(page==='detail'&&cover===1)loadReference();applyTheme()}
function applyTheme(){let p={Classic:['#f7f5eb','#315e43'],Forest:['#e0e9dd','#1e4930'],Arctic:['#e6f3f8','#286c94'],Sunset:['#fcf0e0','#a66a3d']}[state.theme]||['#f7f5eb','#315e43'];document.documentElement.style.background=p[0];document.body.style.background=p[0];document.querySelectorAll('.button:not(.alt):not(.ghost)').forEach(x=>x.style.background=p[1])}
async function loadReference(){let s=mammals.find(x=>x.id===detail);try{let res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(s.name));if(!res.ok)throw Error('No photo');let j=await res.json(),src=j.originalimage?.source||j.thumbnail?.source;if(!src)throw Error('No photo');let e=$('refphoto');if(e)e.innerHTML=`<img style="width:100%;max-height:180px;object-fit:contain;border-radius:10px" src="${escapeHtml(src)}"><p class="tiny">Reference: <a target="_blank" rel="noopener" href="${escapeHtml(j.content_urls?.desktop?.page||'https://en.wikipedia.org')}">Wikipedia source / image attribution</a></p>`}catch{let e=$('refphoto');if(e)e.innerHTML='<p class="muted">Reference photo unavailable. Try again online.</p>'}}
function toast(msg){$('modal').classList.remove('hidden');$('modal').innerHTML=`<div><div class="row"><h2>WildQuest</h2><button class="button alt small" id="close">✕</button></div><p>${msg}</p><button class="button" id="ok">Continue</button></div>`}
function go(p){page=p;render();window.scrollTo(0,0)}
function toDataUrl(f){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,850/img.width,850/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.67))};img.onerror=reject;img.src=url})}
async function readExif(f){gps=null;photoDate=null;let el=$('metadata');el.textContent='Checking photo GPS metadata…';try{let exifr=await import('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.esm.js');let g=await exifr.gps(f),m=await exifr.parse(f,{pick:['DateTimeOriginal','CreateDate']});if(g&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude))gps={latitude:g.latitude,longitude:g.longitude,source:'Photo EXIF'};if(m?.DateTimeOriginal)photoDate=new Date(m.DateTimeOriginal).toISOString();el.textContent=gps?'📍 GPS found in photo (stored privately)':'No embedded GPS found. You can use your current location.'}catch{el.textContent='Photo metadata unavailable (offline or unsupported file).'}}
let classifier;async function identify(){if(!photoData)return;let btn=$('identify');btn.disabled=true;btn.textContent='Loading wildlife AI model (may take time)…';try{if(!classifier){let m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');classifier=await m.pipeline('zero-shot-image-classification','Xenova/clip-vit-base-patch32',{device:'wasm'})}btn.textContent='Analyzing photograph…';let labels=mammals.map(s=>`a wildlife photograph of a ${s.name.toLowerCase()}`);let results=await classifier(photoData,labels,{candidate_labels:labels,hypothesis_template:'{}'});aiResults=results.slice(0,4).map(r=>{let id=labels.indexOf(r.label);return {...mammals[id],score:r.score}}).filter(x=>x.id!==undefined);selectedSpecies=null;$('identifications').classList.remove('hidden');$('identifications').innerHTML=renderPredictions();btn.textContent='Identify animal with AI';btn.disabled=false}catch(e){btn.textContent='Identify animal with AI';btn.disabled=false;toast('AI model could not load. It needs an internet connection and a browser that supports the model. No identification was invented. '+escapeHtml(String(e.message||e).slice(0,130)))}}
function rewardFor(s,n,special){let base={Common:[10,5],Uncommon:[30,15],Rare:[75,35],'Super Rare':[150,75],Legendary:[250,125]}[s.rarity];let mult=[1,.5,.25,.15,.1][Math.min(n,5)-1];let bonus={'None':[0,0],'Albino':[130,65],'Leucistic':[110,55],'Unusual colour morph':[60,30],'Pregnant (unverified)':[0,0]}[special]||[0,0];let already=state.observations.some(o=>o.speciesId===s.id&&o.special===special&&special!=='None');if(already)bonus=[0,0];return [Math.round(base[0]*mult)+bonus[0],Math.round(base[1]*mult)+bonus[1]]}
function saveObservation(){let s=mammals.find(x=>x.id===selectedSpecies);if(!s||!photoData)return;if(!$('wild')?.checked){toast('Only wild animals are eligible for the main MammalDex. Captive observations are not saved in this prototype.');return}let special=$('special').value,n=speciesObs(s.id).length+1,[xp,wc]=rewardFor(s,n,special);state.observations.push({id:Date.now(),speciesId:s.id,image:photoData,date:photoDate||new Date().toISOString(),location:gps,special,xp,wc,verification:'Player-confirmed; not independently verified'});state.xp+=xp;state.wc+=wc;let old=state.level;updateLevel();save();file=null;photoData=null;gps=null;photoDate=null;aiResults=[];selectedSpecies=null;go('home');toast(`<b>${escapeHtml(s.name)} recorded!</b><br>+${xp} XP · +${wc} Wildlife Credits.${state.level>old?`<br>🎉 You reached level ${state.level}!`:''}<br><span class="tiny">This is a provisional player-confirmed observation, not yet research-verified. Special bonuses require verification in a production app.</span>`)}
$('content').addEventListener('click',async e=>{let t=e.target.closest('[data-page],[data-filter],[data-detail],[data-cover],[data-gender],[data-category],[data-equip],[data-theme],[data-buy],[data-select],#identify,#locate,#none,#saveobs,#export');if(!t)return;if(t.dataset.page){go(t.dataset.page);return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.detail){detail=+t.dataset.detail;cover=0;go('detail');return}if(t.dataset.cover){cover=+t.dataset.cover;render();return}if(t.dataset.gender){state.avatar.gender=t.dataset.gender;save();render();return}if(t.dataset.category){editCategory=t.dataset.category;render();return}if(t.dataset.equip){let key=editCategory+':'+t.dataset.equip;if(!state.owned.includes(key)){toast('This item is locked. Visit the Wildlife Shop to unlock it.');return}state.avatar[editCategory]=t.dataset.equip;save();render();return}if(t.dataset.theme){let [name,price]=themes.find(x=>x[0]===t.dataset.theme);if(!state.owned.includes('theme:'+name)&&price){if(state.wc<price){toast('Not enough Wildlife Credits yet.');return}state.wc-=price;state.owned.push('theme:'+name)}state.theme=name;save();render();return}if(t.dataset.buy){let [cat,name]=t.dataset.buy.split(':'),price=catalog[cat].find(x=>x[0]===name)?.[1];if(state.owned.includes(t.dataset.buy))return;if(state.wc<price){toast('Not enough Wildlife Credits yet.');return}state.wc-=price;state.owned.push(t.dataset.buy);save();render();return}if(t.id==='identify'){await identify();return}if(t.id==='none'){toast('No reliable identification. Try a clearer photo. We will add expert review and more species later.');return}if(t.dataset.select!==undefined){selectedSpecies=+t.dataset.select;$('identifications').innerHTML=renderPredictions();return}if(t.id==='saveobs'){saveObservation();return}if(t.id==='locate'){if(!navigator.geolocation){toast('Geolocation is unavailable in this browser.');return}navigator.geolocation.getCurrentPosition(p=>{gps={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,source:'Device location'};$('metadata').textContent='📍 Device location captured privately (±'+Math.round(p.coords.accuracy)+' m)'},err=>toast('Location permission was not granted or location was unavailable.'),{enableHighAccuracy:true,timeout:12000});return}if(t.id==='export'){let data=JSON.stringify({notice:'Unverified prototype observations; GPS is sensitive.',observations:state.observations.map(({image,...rest})=>rest)},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='wildquest-observations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);return}});
$('content').addEventListener('change',async e=>{if(e.target.id==='photo'){file=e.target.files[0];if(!file)return;aiResults=[];selectedSpecies=null;try{photoData=await toDataUrl(file);$('preview').innerHTML=`<img class="preview" src="${photoData}">`;$('identify').disabled=false;await readExif(file)}catch{toast('Unable to open this photo. Try a JPEG image.')}}});$('nav').addEventListener('click',e=>{let t=e.target.closest('[data-page]');if(t)go(t.dataset.page)});$('modal').addEventListener('click',e=>{if(e.target.id==='close'||e.target.id==='ok'||e.target.id==='modal')$('modal').classList.add('hidden')});let startX=0;$('content').addEventListener('touchstart',e=>{if(e.target.closest('#cover'))startX=e.touches[0].clientX},{passive:true});$('content').addEventListener('touchend',e=>{if(e.target.closest('#cover')&&Math.abs(e.changedTouches[0].clientX-startX)>45){cover=e.changedTouches[0].clientX<startX?1:0;render()}},{passive:true});render();
</script></body></html>
